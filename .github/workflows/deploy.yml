name: Deploy CoisaPet para a Hostinger

# Roda toda vez que dá push na main — builda o app React e manda o
# resultado (+ as pastas estáticas que hoje sobem na mão via FileZilla)
# direto pro public_html via FTP. Precisa de 3 secrets configurados em
# Settings > Secrets and variables > Actions: FTP_HOST, FTP_USERNAME,
# FTP_PASSWORD (conta FTP "CoisaPet", trocada em 18/09 — Diretório é a
# raiz do domínio, um nível ACIMA do public_html; ver coisapet.md).
on:
  push:
    branches: [main]
  workflow_dispatch: # também dá pra disparar manualmente pela aba Actions do GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Builda o app (gera dist/)
        run: npm run build

      # ── App React (dist/) → public_html/sistema/ ──────────────────
      # BUG REAL #3 (achado 18/09, o de verdade desta vez): a conta FTP
      # dedicada original ("deploy") tinha o Diretório configurado pra
      # uma pasta "public_html" que era, ela mesma, FAKE — uma pasta
      # com esse nome só que criada POR DENTRO da public_html real
      # (resíduo do primeiro deploy com bug, 17/09). Como FTP usa chroot
      # na pasta configurada, nenhum server-dir deste workflow conseguia
      # "escapar" dali pra cima — não importa o que eu escrevesse aqui,
      # nunca ia cair na raiz de verdade. O Raphael achou o problema real
      # comparando as duas pastas no FileZilla e trocou pra uma 3ª conta
      # FTP ("CoisaPet") cujo Diretório é um nível ACIMA do public_html
      # (a raiz do domínio) — por isso agora todo server-dir abaixo
      # precisa incluir "public_html/" nele.
      #
      # (Bugs #1 e #2, já corrigidos antes deste, ficam só de histórico:
      # #1 era o "public_html/" duplicado quando ainda usávamos a conta
      # antiga; #2 era o app React não apontar pra /sistema/, que
      # vite.config.js exige via base:'/sistema'.)
      - name: Deploy — app React
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/sistema/
          exclude: |
            **/.git*
            **/.git*/**
            **/equipe/**
            **/links/**
            **/doc/**

      # ── Pastas estáticas soltas (fora do build do Vite) ──────────
      - name: Deploy — /equipe (PWA da equipe)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./equipe/
          server-dir: ./public_html/equipe/

      - name: Deploy — /links (bio links + manuais)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./links/
          server-dir: ./public_html/links/

      - name: Deploy — /doc (manuais de produto)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./doc/
          server-dir: ./public_html/doc/
