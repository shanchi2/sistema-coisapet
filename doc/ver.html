<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title id="page-title">Manual | CoisaPet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#1a0f07}
  iframe{border:0;width:100%;height:100%;display:none;background:#fff}
  .msg{
    color:#f5ead7;font-family:-apple-system,sans-serif;text-align:center;
    padding-top:40vh;font-size:14px;opacity:.7;
  }
  .back{
    position:fixed;top:12px;left:12px;z-index:10;
    background:rgba(0,0,0,.55);color:#f5ead7;text-decoration:none;
    font-family:-apple-system,sans-serif;font-size:12px;font-weight:600;
    padding:8px 12px;border-radius:10px;backdrop-filter:blur(4px);
  }
  .pdf-btn{
    position:fixed;top:12px;right:12px;z-index:10;
    background:#b8794e;color:#fff;border:0;cursor:pointer;
    font-family:-apple-system,sans-serif;font-size:12px;font-weight:700;
    padding:8px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35);
    display:none;align-items:center;gap:6px;
  }
  .pdf-btn:active{transform:scale(.96)}
  @media print{
    .back,.pdf-btn,.msg{display:none!important}
    html,body{background:#fff;height:auto}
    iframe{height:auto!important}
  }
</style>
</head>
<body>
<a href="#" id="back-link" class="back">← Voltar</a>
<button id="pdf-btn" class="pdf-btn" type="button">⬇ Baixar PDF</button>
<div id="msg" class="msg">Carregando manual…</div>
<!-- sandbox com allow-same-origin mas SEM allow-scripts: o HTML upado
     continua sem conseguir rodar nenhum script embutido (é isso que
     protege contra XSS), só ganhamos leitura do DOM dele daqui de fora
     pra medir a altura real na hora de imprimir — sem isso o PDF saía
     cortado numa tela só (iframe.contentWindow.print() é instável em
     navegador de celular, principalmente Safari/iPad — achado 20/09,
     Raphael reportou o botão não funcionando no tablet). -->
<iframe id="frame" sandbox="allow-popups allow-same-origin"></iframe>

<script>
const SUPABASE_URL = 'https://lcybmdiqxmbqeuyeuhdj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjeWJtZGlxeG1icWV1eWV1aGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjYyMjMsImV4cCI6MjA4OTAwMjIyM30.gAFVxdM6TMuse27UiASfFiw0NwfdcGhvck7AUv9EXPM'
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const params = new URLSearchParams(location.search)
const path  = params.get('path')
const title = params.get('title')
const back  = params.get('back')

if (title) document.getElementById('page-title').textContent = title + ' | CoisaPet'
document.getElementById('back-link').href = back || 'javascript:history.back()'

async function load() {
  const msg = document.getElementById('msg')
  if (!path) { msg.textContent = 'Nada pra mostrar.'; return }

  // O Supabase Storage não deixa servir .html com content-type renderizável
  // (proteção deles contra XSS, domínio compartilhado) — então buscamos o
  // conteúdo bruto como texto e desenhamos num iframe isolado aqui no nosso
  // próprio domínio, em vez de navegar direto pra URL do arquivo.
  const fileUrl = db.storage.from('product-docs').getPublicUrl(path).data.publicUrl
  try {
    const res = await fetch(fileUrl)
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const html = await res.text()
    const frame = document.getElementById('frame')
    frame.srcdoc = html
    frame.style.display = 'block'
    msg.style.display = 'none'
    document.getElementById('pdf-btn').style.display = 'inline-flex'
  } catch (e) {
    msg.textContent = 'Erro ao carregar o manual. Tente novamente.'
  }
}
load()

document.getElementById('pdf-btn').addEventListener('click', () => {
  const frame = document.getElementById('frame')
  // Expande o iframe pra altura real do conteúdo antes de imprimir —
  // senão só sai a primeira tela (a impressão trata "height:100%" como
  // a altura da janela, não do documento inteiro). Restaura depois.
  let originalHeight = frame.style.height
  try {
    const h = frame.contentDocument.documentElement.scrollHeight
    frame.style.height = h + 'px'
  } catch (e) { /* segue sem expandir — melhor tentar imprimir do que travar */ }

  function restore() {
    frame.style.height = originalHeight
    window.removeEventListener('afterprint', restore)
  }
  window.addEventListener('afterprint', restore)
  setTimeout(restore, 5000) // rede de segurança — nem todo navegador dispara afterprint

  window.print()
})
</script>
</body>
</html>
