<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Manuais de montagem, instruções de uso e vídeos dos produtos CoisaPet."/>
<title>CoisaPet — Manuais e Dicas de Uso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N51GM1SKH1"></script>
<script>
  window.dataLayer=window.dataLayer||[];
  function gtag(){dataLayer.push(arguments);}
  gtag('js',new Date());gtag('config','G-N51GM1SKH1');

<style>
:root{
  --bg:    #1a0f07;
  --card:  rgba(255,255,255,0.05);
  --card-h:rgba(255,255,255,0.09);
  --bdr:   rgba(255,255,255,0.08);
  --txt:   #f5ead7;
  --muted: rgba(245,234,215,0.5);
  --gold:  #C5904A;
  --brown: #6E3F25;
  --font:  'Nunito', sans-serif;
  --r:     16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--txt);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% -10%, rgba(197,144,74,0.18) 0%, transparent 70%),
             radial-gradient(ellipse 50% 40% at 80% 90%, rgba(110,63,37,0.25) 0%, transparent 60%),
             #1a0f07;
}
.page{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;
  padding:48px 20px 64px;
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.avatar{
  width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,var(--brown),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:38px;margin-bottom:16px;
  box-shadow:0 0 0 3px rgba(197,144,74,0.25),0 8px 32px rgba(0,0,0,0.4);
}
.brand{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.brand span{color:var(--gold)}
.tagline{font-size:13px;color:var(--muted);margin-bottom:24px;text-align:center}
.back-link{
  font-size:12px;color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:4px;margin-bottom:16px;align-self:flex-start;
}
.back-link:hover{color:var(--gold)}
.search{
  width:100%;margin-bottom:20px;position:relative;
}
.search input{
  width:100%;background:var(--card);border:1px solid var(--bdr);
  border-radius:var(--r);padding:12px 14px 12px 40px;
  color:var(--txt);font-family:var(--font);font-size:14px;outline:none;
  transition:border-color .18s;
}
.search input:focus{border-color:rgba(197,144,74,0.4)}
.search input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;font-size:14px}
.link-card{
  width:100%;display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--bdr);
  border-radius:var(--r);padding:14px 16px;
  text-decoration:none;color:var(--txt);
  transition:background .18s,border-color .18s,transform .15s;
  margin-bottom:8px;cursor:pointer;
}
.link-card:hover{background:var(--card-h);border-color:rgba(197,144,74,0.3);transform:translateY(-1px)}
.link-card:active{transform:scale(.98)}
.link-icon{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
  background:rgba(255,255,255,0.06);
}
.link-icon img{width:100%;height:100%;object-fit:cover}
.link-body{flex:1;min-width:0}
.link-title{font-size:14px;font-weight:700;line-height:1.2}
.link-sub{font-size:11px;color:var(--muted);margin-top:1px}
.link-arrow{font-size:16px;color:var(--muted);flex-shrink:0;transition:transform .18s,color .18s}
.link-card:hover .link-arrow{transform:translateX(3px);color:var(--gold)}
.skel{
  width:100%;height:68px;border-radius:var(--r);
  background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;margin-bottom:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{color:rgba(255,255,255,.35);text-align:center;font-size:13px;padding:32px 0}
.footer{margin-top:36px;text-align:center;font-size:11px;color:rgba(245,234,215,0.25);line-height:1.8}
.footer a{color:rgba(197,144,74,0.5);text-decoration:none}
.footer a:hover{color:var(--gold)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.link-card{animation:fadeUp .4s ease both}
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">
  <a href="https://coisapet.com.br/links/" class="back-link">← Voltar pros links</a>

  <img src="https://coisapet.com.br/assets/img/logo-coisapet.webp" alt="CoisaPet" style="width:120px;margin-bottom:12px;"/>
  <div class="brand">Manuais &amp; Dicas de Uso</div>
  <div class="tagline">Manual de montagem, instruções de uso e vídeos por produto</div>

  <div class="search">
    <span class="search-icon">🔍</span>
    <input id="search-input" type="text" placeholder="Buscar produto..." autocomplete="off"/>
  </div>

  <div id="list-container" style="width:100%">
    <div class="skel"></div>
    <div class="skel" style="animation-delay:.1s"></div>
    <div class="skel" style="animation-delay:.2s"></div>
  </div>

  <div class="footer">
    <p>© 2026 CoisaPet® · Feito com ♥ para os pets</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lcybmdiqxmbqeuyeuhdj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjeWJtZGlxeG1icWV1eWV1aGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjYyMjMsImV4cCI6MjA4OTAwMjIyM30.gAFVxdM6TMuse27UiASfFiw0NwfdcGhvck7AUv9EXPM'
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let products = []

function publicUrl(bucket, path) {
  if (!path) return null
  return db.storage.from(bucket).getPublicUrl(path).data.publicUrl
}

function render(list) {
  const container = document.getElementById('list-container')
  if (list.length === 0) {
    container.innerHTML = '<p class="empty">Nenhum produto encontrado.</p>'
    return
  }
  container.innerHTML = list.map((p, i) => {
    const photo = publicUrl('product-photos', p.photo_url)
    return `
      <a href="https://coisapet.com.br/doc/${p.slug}" class="link-card" style="animation-delay:${i*0.04}s">
        <div class="link-icon">${photo ? `<img src="${photo}" alt="${p.name}"/>` : '📄'}</div>
        <div class="link-body">
          <div class="link-title">${p.name}</div>
          <div class="link-sub">${p.count} material${p.count > 1 ? 'is' : ''}</div>
        </div>
        <span class="link-arrow">→</span>
      </a>
    `
  }).join('')
}

async function load() {
  const { data, error } = await db
    .from('product_doc_resources')
    .select('product_id, product:products(id,name,slug,photo_url)')

  const container = document.getElementById('list-container')
  if (error || !data) {
    container.innerHTML = '<p class="empty">Erro ao carregar. Tente novamente mais tarde.</p>'
    return
  }

  const map = new Map()
  data.forEach(row => {
    if (!row.product) return
    if (!map.has(row.product_id)) map.set(row.product_id, { ...row.product, count: 0 })
    map.get(row.product_id).count++
  })
  products = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name))

  render(products)
}

document.getElementById('search-input').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase()
  render(q ? products.filter(p => p.name.toLowerCase().includes(q)) : products)
})

load()
</script>
</body>
</html>
